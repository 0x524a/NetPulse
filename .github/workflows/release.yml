name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: netpulse
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: netpulse
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            artifact: netpulse.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: netpulse
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: netpulse

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies  
      run: go mod verify

    - name: Build
      run: |
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.artifact }} ./cmd
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.goos }}-${{ matrix.goarch }}
        path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare releases
      run: |
        mkdir -p releases
        
        # Linux amd64
        cp artifacts/linux-amd64/netpulse releases/netpulse-linux-amd64
        
        # Linux arm64
        cp artifacts/linux-arm64/netpulse releases/netpulse-linux-arm64
        
        # Windows amd64
        cp artifacts/windows-amd64/netpulse.exe releases/netpulse-windows-amd64.exe
        
        # macOS amd64
        cp artifacts/darwin-amd64/netpulse releases/netpulse-macos-amd64
        
        # macOS arm64 (Apple Silicon)
        cp artifacts/darwin-arm64/netpulse releases/netpulse-macos-arm64

    - name: Create checksums
      run: |
        cd releases
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: releases/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
