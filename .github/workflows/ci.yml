name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', '1.27']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download
      env:
        GOFLAGS: "-modcacherw"

    - name: Build
      run: go build -v ./...
      env:
        GOFLAGS: "-modcacherw"

    - name: Vet
      run: go vet ./...

    - name: Vet integration tests
      run: go vet -tags=integration ./...

    - name: Test
      run: go test -v -race -short -coverprofile=coverage.out ./...

    - name: Upload Coverage
      uses: codecov/codecov-action@v5
      if: runner.os == 'Linux' && matrix.go-version == '1.27'
      with:
        files: ./coverage.out
        verbose: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.27-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build packages
      run: go build -v ./...

    # Use the maintained action rather than piping install.sh from `master`
    # into a shell: that script is unpinned, so it silently followed upstream
    # and started serving a tarball whose SHA256 did not match its own
    # published checksum, failing every lint run. The action pins the linter
    # version explicitly and handles its own caching.
    # golangci-lint-action v9 is the current major and supports golangci-lint
    # v2, which is what .golangci.yml's `version: 2` targets. Earlier action
    # majors (<=v6) only drive golangci-lint v1.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif -exclude-generated ./...'

    - name: Fix SARIF file
      if: always()
      run: |
        if [ -f gosec-results.sarif ]; then
          # Remove the problematic fixes field that causes validation errors
          jq 'del(.runs[].results[].fixes)' gosec-results.sarif > gosec-results-fixed.sarif
          mv gosec-results-fixed.sarif gosec-results.sarif
        fi

    - name: Upload Gosec results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
        wait-for-processing: true
