name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', '1.25']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download
      env:
        GOFLAGS: "-modcacherw"

    - name: Build
      run: go build -v ./...
      env:
        GOFLAGS: "-modcacherw"

    - name: Vet
      run: go vet ./...

    - name: Vet integration tests
      run: go vet -tags=integration ./...

    - name: Test
      run: go test -v -race -short -coverprofile=coverage.out ./...

    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      if: runner.os == 'Linux' && matrix.go-version == '1.25'
      with:
        files: ./coverage.out
        verbose: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.25-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build packages
      run: go build -v ./...

    - name: Install golangci-lint
      run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif -exclude-generated ./...'

    - name: Fix SARIF file
      if: always()
      run: |
        if [ -f gosec-results.sarif ]; then
          # Remove the problematic fixes field that causes validation errors
          jq 'del(.runs[].results[].fixes)' gosec-results.sarif > gosec-results-fixed.sarif
          mv gosec-results-fixed.sarif gosec-results.sarif
        fi

    - name: Upload Gosec results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
        wait-for-processing: true
