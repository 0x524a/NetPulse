name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22', '1.24']
    
    env:
      GOWORK: off

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: |
        go mod download
      working-directory: .
      env:
        GOFLAGS: "-modcacherw"

    - name: Build
      run: |
        go build -v ./internal/... ./pkg/...
      env:
        GOFLAGS: "-modcacherw"

    - name: Build CLI
      run: |
        cd cmd
        go mod download
        go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./pkg/... ./internal/...

    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      if: runner.os == 'Linux' && matrix.go-version == '1.24'
      with:
        files: ./coverage.out
        verbose: true

  lint:
    runs-on: ubuntu-latest
    
    env:
      GOWORK: off
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.24-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.24-

    - name: Download dependencies
      run: go mod download
      working-directory: .

    - name: Build packages
      run: go build ./internal/... ./pkg/...

    - name: Build CLI
      run: |
        cd cmd
        go mod download
        go build ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m ./internal/... ./pkg/...

  security:
    runs-on: ubuntu-latest
    
    env:
      GOWORK: off
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./internal/... ./pkg/...'

    - name: Upload Gosec results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
        wait-for-processing: true
