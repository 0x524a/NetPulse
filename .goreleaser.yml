version: 2
project_name: netpulse

builds:
  - id: netpulse
    main: ./cmd/main.go
    binary: netpulse
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.Date={{.Date}}
    hooks:
      pre:
        - go mod tidy

archives:
  - id: netpulse-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md

checksums:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - merge pull request
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "0x524a"
    name: netpulse
  draft: false
  prerelease: false
  name_template: "{{.ProjectName}} {{.Version}}"
  footer: |
    **Full Changelog**: https://github.com/0x524a/netpulse/compare/{{ .PreviousTag }}...{{ .Tag }}
